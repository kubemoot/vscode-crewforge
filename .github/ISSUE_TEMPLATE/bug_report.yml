name: Bug report
description: The CrewForge extension misbehaves.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "This repository covers the CrewForge VS Code extension. Operator or crew problems belong in [kubemoot/kubemoot](https://github.com/kubemoot/kubemoot/issues/new/choose) or [kubemoot/crews](https://github.com/kubemoot/crews/issues/new/choose); questions go to [Discussions](https://github.com/orgs/kubemoot/discussions/categories/q-a)."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and did not find this one
          required: true
  - type: input
    id: crewforge-version
    attributes:
      label: CrewForge version
      placeholder: "The version shown on the extension's page in the Extensions view"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: The version from Help, About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: The OS line from Help, About
    validations:
      required: true
  - type: dropdown
    id: remote
    attributes:
      label: Remote setup
      description: Where VS Code runs relative to your files and cluster.
      options:
        - Local
        - WSL
        - SSH
        - Dev container
        - Codespaces
        - Other
    validations:
      required: true
  - type: input
    id: kmctl-version
    attributes:
      label: kmctl version
      description: Leave blank if the bug does not involve kmctl.
      placeholder: "The output of `kmctl version`"
    validations:
      required: false
  - type: input
    id: kubemoot-version
    attributes:
      label: Kubemoot version
      placeholder: "The operator chart version from `helm list -A`"
    validations:
      required: false
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: "The server version from `kubectl version`"
    validations:
      required: false
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: CrewForge output channel
      description: Open View, Output, and pick CrewForge in the dropdown. Remove secrets first.
      render: shell
    validations:
      required: false
