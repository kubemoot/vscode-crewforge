name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@cee9e2e1fd27c0cc9196578af77dd7b07a585e4f # v0.1.0
        with:
          tag_prefix: "v"

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Set up Node
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # A candidate packages the .vsix at its version to prove the release works, and
      # publishes nothing: the .vsix is kept only as this run's workflow artifact.
      # package.json keeps 0.0.0 in git; the version is set here, never committed.
      - name: Package the candidate
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version --no-git-tag-version "${VERSION}"
          npm run package

      - name: Keep the candidate .vsix
        if: steps.version.outputs.release_created == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: crewforge-${{ steps.version.outputs.version }}
          path: crewforge-*.vsix
          if-no-files-found: error
