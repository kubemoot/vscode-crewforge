name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@76c35a749b9db4105e73307b91b8f7cf1359b755 # v0.4.0
        with:
          tag_prefix: "v"

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      # CHANGELOG.md comes from the GitHub Releases, the candidate on top; the token is
      # only in this step, so no install or build script sees it.
      - name: Write the changelog
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/changelog.sh "${VERSION}" > CHANGELOG.md

      - name: Set up Node
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A candidate packages the .vsix at its version to prove the release works, and
      # publishes nothing: the .vsix is kept only as this run's workflow artifact.
      # package.json keeps 0.0.0 in git; the version is set here, never committed. The
      # README's relative images and links point at this commit on GitHub.
      - name: Package the candidate
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version --no-git-tag-version "${VERSION}"
          npm run package -- --githubBranch "${GITHUB_SHA}"

      - name: Keep the candidate .vsix
        if: steps.version.outputs.release_created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crewforge-${{ steps.version.outputs.version }}
          path: crewforge-*.vsix
          if-no-files-found: error
