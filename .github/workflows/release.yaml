name: Release

# A Kubemoot Publish Release sends the kubemoot-published event when it succeeds; this
# repository then builds a forced candidate (as kmctl and the crews do), so the next
# Publish Release here has a candidate cut after the Kubemoot release, and a release of
# Kubemoot always leaves CrewForge with a candidate to publish.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [kubemoot-published]

# Pushes build one candidate at a time, so two pushes close together do not compute the same
# rc.N. The Kubemoot dispatch has its own group: in the shared group, a pending dispatch is
# replaced by the next push run and the event is lost without a trace. A dispatch that
# computes the same version as a push finds the tag already pushed and skips ("tag already
# exists" below), so the two cannot publish two candidates for one version.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'release-candidate-dispatch' || 'release-candidate' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@46be10555367466d5add34c0f37dc2ae86c40af6 # v0.12.0
        with:
          tag_prefix: "v"
          force: ${{ github.event_name == 'repository_dispatch' }}

      - name: Mint a release token
        id: app-token
        if: steps.version.outputs.release_created == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: vscode-crewforge
          permission-contents: write
          permission-workflows: write

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          if [ "${DRY_RUN:-false}" != true ]; then
            if [ -z "${GH_APP_TOKEN:-}" ]; then
              echo "::error::no release token: the mint step did not run" >&2
              exit 1
            fi
            auth="$(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 -w0)"
            echo "::add-mask::${auth}"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      # CHANGELOG.md comes from the GitHub Releases, the candidate on top; the token is
      # only in this step, so no install or build script sees it.
      - name: Write the changelog
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/changelog.sh "${VERSION}" > CHANGELOG.md

      - name: Set up Node
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A candidate packages the .vsix at its version to prove the release works, and
      # publishes nothing: the .vsix is kept only as this run's workflow artifact.
      # package.json keeps 0.0.0 in git; the version is set here, never committed. The
      # README's relative images and links point at this commit on GitHub.
      - name: Package the candidate
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version --no-git-tag-version "${VERSION}"
          npm run package -- --githubBranch "${GITHUB_SHA}"

      - name: Keep the candidate .vsix
        if: steps.version.outputs.release_created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crewforge-${{ steps.version.outputs.version }}
          path: crewforge-*.vsix
          if-no-files-found: error
