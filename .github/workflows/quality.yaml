# Independent quality pipeline - runs in parallel with CI, never blocks builds.
# Reports to the self-hosted SonarQube for centralized code quality analysis.
# Main only: SonarQube is reachable from the self-hosted cluster runners, and pull
# requests run on GitHub-hosted runners that cannot reach it.
name: Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: homelab-runners
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for SonarQube new-code detection

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage -- --coverage.reporter=lcov --coverage.reporter=text-summary
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
