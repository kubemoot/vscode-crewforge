name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test, with coverage thresholds
        run: npm run test:coverage

      - name: Package
        run: npm run package

      - name: Upload the extension
        uses: actions/upload-artifact@v5
        with:
          name: crewforge-vsix
          path: '*.vsix'

  integration:
    # A real VS Code runs the packaged extension against a local fake API server, so
    # this needs no cluster; it runs on GitHub-hosted runners, under a virtual display.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache the VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Integration tests in VS Code
        run: xvfb-run -a npm run test:integration
