# Promote Release: publish a tested CrewForge release candidate as a GitHub Release.
#
# Every push to main tags a release candidate vX.Y.Z-rc.N and packages its .vsix
# without publishing it. A maintainer runs this workflow (Actions tab, Run workflow;
# dispatch needs write access) to tag the candidate's commit vX.Y.Z and write the
# GitHub Release with the .vsix attached and notes from the conventional commits since
# the previous release. The .vsix is packaged again from the candidate's commit at the
# final version, since the version is part of the package. The default is a dry run:
# the .vsix is built and kept as a workflow artifact, the run summary shows the notes,
# and nothing is tagged or published.
#
# Every released .vsix is verifiable without a stored key. The sign job signs it
# keylessly with cosign under this workflow's GitHub OIDC identity
# (crewforge-<version>.vsix.sigstore.json) and records SLSA build provenance with
# actions/attest (crewforge-<version>.intoto.jsonl, also kept in the repository's
# attestations); the release job attaches both when it creates the GitHub Release, since
# GitHub's immutable releases lock the assets on publish. A dry run signs and verifies
# its .vsix too, so a signing problem shows before anything is tagged; it attests nothing.
#
# With publish_marketplaces, a promotion that is not a dry run also publishes the .vsix
# attached to the GitHub Release to the VS Code Marketplace and Open VSX. It needs the
# registry credentials. Open VSX: Trusted Publishing (no secret; the namespace trusts
# this repository's promote-release.yaml in the marketplace environment), or OVSX_PAT
# when set, which the first version of a namespace needs and which takes precedence.
# Marketplace: AZURE_CLIENT_ID and AZURE_TENANT_ID (a Microsoft Entra managed identity
# trusted for the marketplace environment) or VSCE_PAT. The Marketplace credential is
# checked first, so a missing one stops the run before anything is tagged; a dry run
# with publish_marketplaces checks it too. With pre_release, the
# .vsix is packaged as a pre-release, the GitHub Release's copy included. The CLI
# versions are the @vscode/vsce and ovsx devDependencies in package-lock.json.
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a vX.Y.Z-rc.N tag on main'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: build the .vsix and show the notes, publish nothing'
        required: true
        default: true
        type: boolean
      publish_marketplaces:
        description: 'Also publish the .vsix to the VS Code Marketplace and Open VSX (never on a dry run)'
        required: true
        default: false
        type: boolean
      pre_release:
        description: 'Publish to the registries as a pre-release version'
        required: true
        default: false
        type: boolean

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    # The same runners as every release in the ecosystem, and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      final_tag: ${{ steps.plan.outputs.final_tag }}
      marketplace_auth: ${{ steps.registries.outputs.marketplace }}
      openvsx_auth: ${{ steps.registries.outputs.openvsx }}
    steps:
      - name: Check the registry credentials
        id: registries
        if: ${{ inputs.publish_marketplaces }}
        env:
          HAS_ENTRA: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
          HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
          HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
        run: |
          missing=0
          if [ "${HAS_ENTRA}" = true ]; then
            echo "marketplace=entra" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_VSCE_PAT}" = true ]; then
            echo "marketplace=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Marketplace credential: set AZURE_CLIENT_ID and AZURE_TENANT_ID, or VSCE_PAT."
            missing=1
          fi
          if [ "${HAS_OVSX_PAT}" = true ]; then
            echo "openvsx=pat" >> "$GITHUB_OUTPUT"
          else
            echo "openvsx=trusted" >> "$GITHUB_OUTPUT"
            echo "Open VSX: Trusted Publishing (no OVSX_PAT). The namespace must trust this workflow and hold a published version."
          fi
          exit "${missing}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@76c35a749b9db4105e73307b91b8f7cf1359b755 # v0.4.0

      # Plans the promotion without tagging, so a failed build leaves no final tag.
      - name: Plan the final version
        id: plan
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: 'true'
          OUT_DIR: ${{ runner.temp }}/promotion
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single v CrewForge "${OUT_DIR}" >> "$GITHUB_OUTPUT"
          cat "${OUT_DIR}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the promoted commit
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: git checkout --quiet "${COMMIT}"

      # CHANGELOG.md comes from the GitHub Releases, this version's notes on top, so the
      # registries' Changelog tab matches them; the token is only in this step, so no
      # install or build script sees it.
      - name: Write the changelog
        env:
          FINAL_TAG: ${{ steps.plan.outputs.final_tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/changelog.sh "${FINAL_TAG#v}" > CHANGELOG.md

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The README's relative images and links point at this commit on GitHub, so a
      # registry page shows the README as it was at the release.
      - name: Test and package at the final version
        env:
          FINAL_TAG: ${{ steps.plan.outputs.final_tag }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          OUT_DIR: ${{ runner.temp }}/promotion
        run: |
          npm ci
          npm test
          npm version --no-git-tag-version "${FINAL_TAG#v}"
          flags=(--githubBranch "${COMMIT}")
          if [ "${PRE_RELEASE}" = true ]; then flags+=(--pre-release); fi
          npm run package -- "${flags[@]}"
          mv crewforge-*.vsix "${OUT_DIR}/"
          git checkout --quiet -- package.json package-lock.json CHANGELOG.md

      - name: Tag the final version
        if: ${{ !inputs.dry_run }}
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: 'false'
          OUT_DIR: ${{ runner.temp }}/promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single v CrewForge "${OUT_DIR}"

      - name: Keep the promotion output
        uses: actions/upload-artifact@v7
        with:
          name: promotion
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: error
          retention-days: 30

  # Runs where the .vsix was built, so the provenance names that runner environment.
  sign:
    needs: promote
    runs-on: homelab-runners
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing and the provenance attestation
      attestations: write # store the provenance attestation in the repository
    steps:
      - name: Download the promotion output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion
          path: promotion

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The certificate names the workflow that signed: promote-release.yaml on main.
      - name: Sign the .vsix with Sigstore
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          mkdir signatures
          for vsix in promotion/crewforge-*.vsix; do
            bundle="signatures/$(basename "${vsix}").sigstore.json"
            cosign sign-blob --yes --bundle "${bundle}" "${vsix}"
            cosign verify-blob "${vsix}" --bundle "${bundle}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Attest the build provenance
        id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: promotion/crewforge-*.vsix

      - name: Name the provenance for the release
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FINAL_TAG: ${{ needs.promote.outputs.final_tag }}
        run: cp "${BUNDLE}" "signatures/crewforge-${FINAL_TAG#v}.intoto.jsonl"

      - name: Keep the signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [promote, sign]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the promotion output
        uses: actions/download-artifact@v8
        with:
          name: promotion
          path: promotion

      - name: Download the signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: promotion

      # The release carries only a .vsix whose provenance verifies as this workflow's.
      - name: Verify the .vsix against its provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.promote.outputs.final_tag }}
        run: |
          gh attestation verify "promotion/crewforge-${TAG#v}.vsix" --repo "${GITHUB_REPOSITORY}" \
            --bundle "promotion/crewforge-${TAG#v}.intoto.jsonl" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/promote-release.yaml"

      - name: Create the GitHub Release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # promotion/releases.tsv: tag, title, notes file (one release per line).
          while IFS=$'\t' read -r tag title notes; do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "${tag} already has a release"
              continue
            fi
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "${title}" --notes-file "promotion/${notes}" \
              "promotion/crewforge-${tag#v}.vsix" \
              "promotion/crewforge-${tag#v}.vsix.sigstore.json" \
              "promotion/crewforge-${tag#v}.intoto.jsonl"
          done < promotion/releases.tsv

  publish:
    needs: [promote, release]
    if: ${{ !inputs.dry_run && inputs.publish_marketplaces }}
    runs-on: ubuntu-latest
    # The Entra managed identity trusts this environment's OIDC subject
    # (repo:kubemoot/vscode-crewforge:environment:marketplace), nothing broader; the
    # environment's protection rules (CONTRIBUTING.md) also gate this job.
    environment: marketplace
    permissions:
      contents: read # the repository's lockfile and the GitHub Release's .vsix
      id-token: write # Entra sign-in for the Marketplace and Open VSX Trusted Publishing
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.promote.outputs.commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the publishing CLIs run here; no install script runs in a job that holds tokens.
      - name: Install the publishing CLIs
        run: npm ci --ignore-scripts

      # The registries get exactly the file the GitHub Release carries.
      - name: Download the .vsix from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.promote.outputs.final_tag }}
          OUT_DIR: ${{ runner.temp }}/vsix
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "crewforge-${TAG#v}.vsix" --dir "${OUT_DIR}"

      - name: Sign in to Microsoft Entra
        if: needs.promote.outputs.marketplace_auth == 'entra'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The Marketplace adds the identity to the publisher by this profile ID (it is not
      # a secret), so the first Entra run shows the ID to add before its publish fails.
      - name: Show the identity's Marketplace member ID
        if: needs.promote.outputs.marketplace_auth == 'entra'
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      # --skip-duplicate makes a re-run safe after one registry took the version. vsce
      # checks that --pre-release matches how the .vsix was packaged; ovsx reads the
      # pre-release mark from the .vsix itself.
      - name: Publish to the VS Code Marketplace
        env:
          AUTH: ${{ needs.promote.outputs.marketplace_auth }}
          VSCE_PAT: ${{ needs.promote.outputs.marketplace_auth == 'pat' && secrets.VSCE_PAT || '' }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          TAG: ${{ needs.promote.outputs.final_tag }}
          OUT_DIR: ${{ runner.temp }}/vsix
        run: |
          flags=(--skip-duplicate)
          if [ "${PRE_RELEASE}" = true ]; then flags+=(--pre-release); fi
          if [ "${AUTH}" = entra ]; then flags+=(--azure-credential); fi
          npx --no-install vsce publish --packagePath "${OUT_DIR}/crewforge-${TAG#v}.vsix" "${flags[@]}"

      # Trusted Publishing exchanges this job's GitHub OIDC token for a short-lived Open
      # VSX token; OVSX_PAT, when set, takes precedence (needed for a namespace's first
      # version, before the trusted publisher can be registered).
      - name: Publish to Open VSX
        env:
          AUTH: ${{ needs.promote.outputs.openvsx_auth }}
          OVSX_PAT: ${{ needs.promote.outputs.openvsx_auth == 'pat' && secrets.OVSX_PAT || '' }}
          TAG: ${{ needs.promote.outputs.final_tag }}
          OUT_DIR: ${{ runner.temp }}/vsix
        run: |
          flags=(--skip-duplicate)
          if [ "${AUTH}" != pat ]; then flags+=(--trusted-publishing); fi
          npx --no-install ovsx publish "${OUT_DIR}/crewforge-${TAG#v}.vsix" "${flags[@]}"
